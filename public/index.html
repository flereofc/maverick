<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maverick</title>
<meta name="description" content="Maverick — a local chat client for the Navy API.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23232221'/%3E%3Cpath d='M9.5 22V10l3.5 6 3.5-6v12' stroke='%23f0eeea' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script>
try { var t = localStorage.getItem('maverick.theme'); document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-head">
        <button id="workspace-btn" class="workspace-btn" aria-expanded="false">
          <span class="workspace-logo">M</span>
          <span class="sidebar-copy workspace-name">maverick</span>
          <svg class="sidebar-copy workspace-chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4 4-4"/></svg>
        </button>
        <button id="sidebar-collapse" class="side-icon" aria-label="Collapse sidebar">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l-6 6 6 6"/></svg>
        </button>
        <button id="sidebar-expand" class="side-icon" aria-label="Expand sidebar" hidden>
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l6 6-6 6"/></svg>
        </button>
      </div>

      <div id="workspace-menu" class="workspace-menu" hidden>
        <button class="ws-row" data-act="settings"><span class="ws-glyph">&#9881;</span> Settings</button>
        <button class="ws-row" data-act="home"><span class="ws-glyph">&#127968;</span> Home</button>
        <button class="ws-row" data-act="invite"><span class="ws-glyph">&#43;</span> Invite users</button>
        <div class="ws-sep"></div>
        <button class="ws-row" data-act="about"><span class="ws-glyph">&#8505;</span> About</button>
      </div>

      <nav class="rail">
        <button id="new-chat-btn" class="rail-btn">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3l3 3-9 9-4 1 1-4z"/></svg>
          <span class="sidebar-copy">New chat</span>
        </button>
        <button id="home-btn" class="rail-btn">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l7-6 7 6v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8 17V10h4v7"/></svg>
          <span class="sidebar-copy">Home</span>
        </button>
        <button id="invite-btn" class="rail-btn">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path d="M10 12c-4 0-6 2-6 4"/><path d="M17 12v4M15 14h4"/></svg>
          <span class="sidebar-copy">Invite users</span>
          <span class="sidebar-copy rail-count">3/10</span>
        </button>
      </nav>

      <div class="chats-scroll">
        <div class="chats-head">
          <span id="chats-label" class="sidebar-copy chats-label">Chats</span>
          <button id="search-toggle" class="side-icon" aria-label="Search chats">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><path d="M14 14l3.5 3.5"/></svg>
          </button>
          <div id="search-box" class="search-box" hidden>
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><path d="M14 14l3.5 3.5"/></svg>
            <input id="conv-search" placeholder="Search chats" spellcheck="false">
            <button id="search-close" class="side-icon" aria-label="Close search">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
            </button>
          </div>
        </div>
        <nav id="conv-list" class="conv-list" aria-label="Conversations"></nav>
      </div>

      <div class="sidebar-foot">
        <button id="key-status-btn" class="foot-row">
          <span class="dot" id="key-dot"></span>
          <span id="key-status-label" class="sidebar-copy">Add API key</span>
        </button>
        <button id="settings-btn" class="foot-cta">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M19 10a9 9 0 0 0-.2-1.8l-2.3-.8a7 7 0 0 0-1-1.6l.6-2.4a9 9 0 0 0-3-1.8l-1.9 1.5a7 7 0 0 0-1.9 0L7.4 1.6A9 9 0 0 0 4.4 3.4l.6 2.4a7 7 0 0 0-1 1.6l-2.3.8A9 9 0 0 0 1.5 10a9 9 0 0 0 .2 1.8l2.3.8a7 7 0 0 0 1 1.6l-.6 2.4a9 9 0 0 0 3 1.8l1.9-1.5a7 7 0 0 0 1.9 0l1.9 1.5a9 9 0 0 0 3-1.8l-.6-2.4a7 7 0 0 0 1-1.6l2.3-.8A9 9 0 0 0 19 10z"/></svg>
          <span class="sidebar-copy">Settings</span>
        </button>
      </div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>
      <div id="topbar-title" class="topbar-title">New conversation</div>
      <div class="topbar-right">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 12.5A7.5 7.5 0 0 1 7.5 3a7.5 7.5 0 1 0 9.5 9.5z"/></svg>
        </button>
      </div>
    </header>

    <div id="empty-state" class="empty-state">
      <div class="empty-inner">
        <div class="empty-title-row">
          <span class="empty-mark" aria-hidden="true"><span class="glyph">M</span></span>
          <h1>What are we building today?</h1>
        </div>
        <p class="empty-sub">Pick a model below and ask anything. Everything stays in your browser.</p>
        <button class="btn-primary" id="empty-new-btn">New conversation</button>
      </div>
    </div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <button id="scroll-down-btn" class="scroll-down-btn" title="Scroll to bottom" aria-label="Scroll to bottom" hidden>
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l6 6 6-6"/></svg>
    </button>

    <div id="composer-wrap" class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="How can I help you today?" autocomplete="off" spellcheck="false"></textarea>
        <div id="attach-strip" class="attach-strip" hidden></div>
        <div class="composer-bar">
          <div class="composer-left">
            <button id="attach-btn" class="icon-btn attach-btn" title="Attach image">
              <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8.5l-7.1 7.1a4 4 0 0 1-5.6-5.6L11.5 2.8a2.7 2.7 0 0 1 3.8 3.8l-7 7a1.3 1.3 0 0 1-1.9-1.9l6.3-6.3"/></svg>
            </button>
            <input type="file" id="file-input" accept="image/*" multiple hidden>
            <button id="model-btn" class="select-btn" title="Switch model">
              <span id="model-btn-name">gpt-5.2</span>
              <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4 4-4"/></svg>
            </button>
            <span id="composer-hint" class="composer-hint"></span>
          </div>
          <div class="composer-actions">
            <button id="stop-btn" class="btn btn-stop" title="Stop generating" aria-label="Stop generating" hidden>
              <svg viewBox="0 0 20 20" width="12" height="12"><rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/></svg>
            </button>
            <button id="send-btn" class="btn btn-send" title="Send (Enter)" aria-label="Send">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5"/></svg>
            </button>
          </div>
        </div>
      </div>
      <p class="composer-note">Your key stays in this browser — it's sent only to the provider you choose in Settings</p>
    </div>
  </main>
</div>

<div id="model-panel" class="model-panel" hidden>
  <div class="model-panel-head">
    <input id="model-search" type="search" placeholder="Search models…" autocomplete="off" spellcheck="false">
    <button id="model-panel-close" class="icon-btn" title="Close (Esc)" aria-label="Close">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>
  <div id="model-list" class="model-list"></div>
  <div class="model-panel-foot">
    <span id="model-count"></span>
    <a href="https://api.navy/dashboard" target="_blank" rel="noopener">Get a key</a>
  </div>
</div>

<div id="drawer-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
